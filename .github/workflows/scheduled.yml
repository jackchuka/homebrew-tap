name: Scheduled Update of Formulae and Casks
on:
    workflow_dispatch:
    schedule:
        - cron: "00 18 * * *"

jobs:
    update:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
              with:
                  aqua_version: v2.55.0

            - name: Update formulae
              run: |
                  make update
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push
              uses: EndBug/add-and-commit@645ecc0dd0a57f4d86d26c0aa5fc42c0a856fbca # v11.0.0
              with:
                  add: "Formula/*.rb Casks/*.rb"
