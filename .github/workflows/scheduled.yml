name: Scheduled Update of Formulae and Casks
on:
    workflow_dispatch:
    schedule:
        - cron: "00 18 * * *"

jobs:
    update:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
              with:
                  aqua_version: v2.55.0

            - name: Update formulae
              run: |
                  make update
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit and push
              uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
              with:
                  add: "Formula/*.rb Casks/*.rb"
